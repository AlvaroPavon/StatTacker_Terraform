#cloud-config
package_upgrade: true

packages:
  - apache2
  - php
  - php8.2
  - libapache2-mod-php8.2
  - php8.2-mysql
  - php8.2-mbstring
  - php8.2-xml
  - php8.2-curl
  - php8.2-zip
  - php8.2-gd
  - php8.2-intl
  - php8.2-opcache
  - mysql-server
  - git
  - composer
  - unzip

runcmd:
  # Iniciar y habilitar MySQL
  - systemctl enable mysql
  - systemctl start mysql

  # Configurar MySQL - crear base de datos y usuario
  - |
    mysql -e "CREATE DATABASE IF NOT EXISTS proyecto_imc CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
    mysql -e "CREATE USER IF NOT EXISTS 'stattracker'@'localhost' IDENTIFIED BY 'Stattracker2025!';"
    mysql -e "GRANT ALL PRIVILEGES ON proyecto_imc.* TO 'stattracker'@'localhost';"
    mysql -e "FLUSH PRIVILEGES;"

  # Clonar repositorio
  - git clone --branch main https://github.com/AlvaroPavon/StatTracker.git /var/www/stattracker

  # Instalar dependencias PHP con Composer
  - cd /var/www/stattracker && composer install --no-dev --optimize-autoloader --no-interaction

  # Importar esquema de base de datos
  - mysql proyecto_imc < /var/www/stattracker/database.sql

  # Configurar Apache para servir StatTracker
  - |
    cat > /etc/apache2/sites-available/stattracker.conf << 'APACHE_EOF'
    <VirtualHost *:80>
        ServerName stattracker.local
        DocumentRoot /var/www/stattracker

        <Directory /var/www/stattracker>
            Options -Indexes +FollowSymLinks
            AllowOverride All
            Require all granted
        </Directory>

        ErrorLog ${APACHE_LOG_DIR}/stattracker-error.log
        CustomLog ${APACHE_LOG_DIR}/stattracker-access.log combined
    </VirtualHost>
    APACHE_EOF

  - a2dissite 000-default
  - a2ensite stattracker
  - a2enmod rewrite
  - systemctl restart apache2

  # Configurar permisos
  - chown -R www-data:www-data /var/www/stattracker
  - chmod -R 755 /var/www/stattracker
  - chmod -R 775 /var/www/stattracker/uploads

  # Habilitar y reiniciar servicios
  - systemctl enable apache2
  - systemctl restart apache2

  # Verificar que todo funciona
  - curl -s -o /dev/null -w "%{http_code}" http://localhost > /tmp/stattracker_status

final_message: "StatTracker desplegado correctamente despues de $UPTIME segundos"
